name: stay_composed
description: "Stay Composed — TrueOwner Lost & Found + Blood Donation for college campuses."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  flutter_dotenv: ^5.1.0
  # Routing
  go_router: ^14.2.0

  # Google Sign-In (frontend flow only; backend verifies domain/token)
  google_sign_in: ^6.2.1

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  web_socket_channel: ^3.0.1
  # Networking (abstracted behind services; not wired to a backend yet)
  dio: ^5.4.3+1

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Local persistence (session cache only — not a source of truth)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  image_path: "assets/images/stay_composed_logo.png"
  min_sdk_android: 21
  # If your logo has transparent edges and looks cramped on Android's
  # adaptive icon shapes, uncomment and tune these:
  # adaptive_icon_background: "#FFFFFF"
  # adaptive_icon_foreground: "assets/images/stay_composed_logo.png"